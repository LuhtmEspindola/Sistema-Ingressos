<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>Erro — TicketHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<aside class="sidebar">
  <a th:href="@{/}" class="sidebar-brand">
    <div class="brand-logo">🎟</div>
    <div class="brand-label"><span class="brand-name">TicketHub</span><span class="brand-sub">Ingressos</span></div>
  </a>
  <span class="sidebar-section">Menu</span>
  <ul class="sidebar-nav">
    <li><a th:href="@{/}"><span class="nav-icon">🏠</span>Dashboard</a></li>
    <li><a th:href="@{/eventos}"><span class="nav-icon">📅</span>Eventos</a></li>
    <li><a th:href="@{/ingressos}"><span class="nav-icon">🎟</span>Ingressos</a></li>
  </ul>
  <div class="sidebar-footer">v1.0 &bull; MongoDB Atlas</div>
</aside>
<div class="page-wrapper">
<header class="topbar"><span class="topbar-title">Erro</span></header>
<main class="main-content">
  <div class="page-header">
    <div><h1 class="page-title">Ocorreu um erro</h1></div>
  </div>
  <div class="alert alert-error" th:text="${erro}"></div>
  <a th:href="@{/}" class="btn btn-primary">Voltar ao Dashboard</a>
</main>
<footer class="footer"><p>Sistema de Ingressos &copy; 2026</p></footer>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>Detalhe do Ingresso — TicketHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<aside class="sidebar">
  <a th:href="@{/}" class="sidebar-brand">
    <div class="brand-logo">🎟</div>
    <div class="brand-label"><span class="brand-name">TicketHub</span><span class="brand-sub">Ingressos</span></div>
  </a>
  <span class="sidebar-section">Menu</span>
  <ul class="sidebar-nav">
    <li><a th:href="@{/}"><span class="nav-icon">🏠</span>Dashboard</a></li>
    <li><a th:href="@{/eventos}"><span class="nav-icon">📅</span>Eventos</a></li>
    <li><a th:href="@{/ingressos}" class="active"><span class="nav-icon">🎟</span>Ingressos</a></li>
    <li><a th:href="@{/ingressos/novo}"><span class="nav-icon">➕</span>Emitir Ingresso</a></li>
  </ul>
  <div class="sidebar-footer">v1.0 &bull; MongoDB Atlas</div>
</aside>
<div class="page-wrapper">
<header class="topbar"><span class="topbar-title">Detalhe do Ingresso</span></header>
<main class="main-content">
  <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
  <div class="page-header">
    <div><h1 class="page-title">Detalhe do Ingresso</h1><p class="page-subtitle" th:text="${descricaoTipo}"></p></div>
    <a th:href="@{/ingressos}" class="btn btn-ghost">Voltar</a>
  </div>

  <div class="ingresso-card" th:if="${ingresso}">
    <div class="ingresso-header">
      <div>
        <span th:if="${ingresso.tipo == 'VIP'}"    class="badge badge-vip ingresso-tipo-badge">VIP</span>
        <span th:if="${ingresso.tipo == 'NORMAL'}" class="badge badge-normal ingresso-tipo-badge">Normal</span>
        <span th:if="${ingresso.tipo == 'MEIA'}"   class="badge badge-meia ingresso-tipo-badge">Meia-Entrada</span>
        <p style="margin-top:.5rem;font-size:.8rem;color:var(--text-muted)" th:text="${descricaoTipo}"></p>
      </div>
      <div style="text-align:right">
        <div class="valor-destaque"
             th:classappend="${ingresso.tipo == 'VIP'} ? 'valor-vip' : (${ingresso.tipo == 'MEIA'} ? 'valor-meia' : 'valor-normal')"
             th:text="'R$ ' + ${#numbers.formatDecimal(valorCalculado, 1, 2)}">
        </div>
      </div>
    </div>

    <div class="ingresso-info">
      <div class="info-item"><label>Evento</label><span th:text="${ingresso.nomeEvento}"></span></div>
      <div class="info-item"><label>Local</label><span th:text="${ingresso.local}"></span></div>
      <div class="info-item"><label>Data do Evento</label><span th:text="${ingresso.dataEvento}"></span></div>
      <div class="info-item"><label>Comprador</label><span th:text="${ingresso.nomeComprador}"></span></div>
      <div class="info-item"><label>CPF</label><span th:text="${ingresso.cpfComprador}"></span></div>
      <div class="info-item"><label>Data da Compra</label>
        <span th:text="${#temporals.format(ingresso.dataCompra, 'dd/MM/yyyy HH:mm')}"></span>
      </div>
    </div>

    <div class="form-actions">
      <a th:href="@{/ingressos}" class="btn btn-ghost">Voltar a lista</a>
      <form th:action="@{/ingressos/cancelar/{id}(id=${ingresso.id})}" method="post" style="display:inline">
        <button type="submit" class="btn btn-danger" onclick="return confirm('Cancelar este ingresso?')">Cancelar Ingresso</button>
      </form>
    </div>
  </div>
</main>
<footer class="footer"><p>Sistema de Ingressos &copy; 2026</p></footer>
</div>
</body>
</html>
